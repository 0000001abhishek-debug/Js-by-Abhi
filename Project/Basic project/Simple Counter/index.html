<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">
    <div class="counter">
      <p id="count">0</p>
    </div>
    <div>
      <button onclick="inc()">Increment</button>
      <button onclick="dec()">Decrement</button>
    </div>

    <div class="clicks">
      <p>Click on Increment: <span id="incCount">0</span></p>
      <p>Click on Decrement: <span id="decCount">0</span></p>
    </div>
  </div>
  <script src="script.js"></script>

</body>

</html>
